name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 版本与 Release 已存在时仍然重新构建并更新 Release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION 文件为空或缺失" >&2
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION 必须是 <major>.<minor>.<patch> 形式，当前为：$version" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "强制模式：忽略已有 Release，重新构建并更新 $tag"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已有 Release，VERSION 未变更，跳过发布"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "准备发布新版本 $tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.version.outputs.should_release == 'true'
        uses: docker/metadata-action@v5
        with:
          images: akise/azur-lane-level-trace
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        if: steps.version.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          OUTPUT: ${{ github.workspace }}/release-notes.md
        run: |
          set -euo pipefail
          ./.github/scripts/generate_release_notes.sh
          cat "$OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$GITHUB_WORKSPACE/release-notes.md"
            echo "已更新 GitHub Release：$TAG"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$GITHUB_WORKSPACE/release-notes.md"
            echo "已基于现有标签创建 GitHub Release：$TAG"
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TAG" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md"
            echo "已创建 GitHub Release：$TAG"
          fi
