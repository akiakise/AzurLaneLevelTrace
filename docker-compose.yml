services:
  blhx-training:
    # 固定版本时改为具体标签，例如 akise/azur-lane-level-trace:1.0.4
    image: akise/azur-lane-level-trace:latest
    container_name: blhx-training
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      WIKI_REQUEST_INTERVAL: "0.12"
    volumes:
      - ./data:/data
    restart: unless-stopped
